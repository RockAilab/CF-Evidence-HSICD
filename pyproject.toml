[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hsi-cd-inference"
version = "0.2.0"
description = "Counterfactual evidence inference for label-free hyperspectral change detection"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "numpy>=1.23",
  "scikit-image>=0.21",
]

[project.scripts]
hsi-cd-infer = "hsi_cd_inference.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
